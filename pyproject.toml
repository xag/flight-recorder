[project]
# PyPI has no scopes, so the npm scope becomes a prefix: @xag/flight-recorder -> xag-flight-recorder.
# The bare name is not available — PyPI collapses hyphens, colliding with `flightrecorder` (2014,
# paragliding GPS loggers). The import name stays `flight_recorder` on every runtime.
name = "xag-flight-recorder"
version = "0.8.0"
description = "Record tool calls at an app's nondeterminism boundary; replay them deterministically with every internal variable observable"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

# The design checker: claims over a render tape. `flight-design tape.jsonl --tokens tokens.json`.
# It reads a tape, so it needs no browser and no dependencies — only the CAPTURE needs a browser.
[project.scripts]
flight-design = "flight_recorder.design:run_cli"

# Loaded by pytest when installed; inert unless `flight_recordings` is set (see
# flight_recorder/pytest_plugin.py). pytest is never imported at library import time.
[project.entry-points.pytest11]
flight_recorder = "flight_recorder.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# The ledger is NOT a dependency group, and cannot be one. quern depends on this package at
# runtime — it records its own boundary — so in this checkout, and only in this one, the
# dependency is circular: uv would need `xag-flight-recorder` from git and from the editable
# root at once, and refuses two URLs for one name. That is not a packaging accident. A recorder
# cannot record itself, any more than an eye can see itself; quern sits downstream of this
# package and the arrow only points one way.
#
# So the check runs OUT of the project environment, where the root package is not installed and
# there is nothing to collide with. It needs quern and nothing from this tree but the source:
#
#     uv run --no-project --with "quern @ git+https://github.com/xag/quern" python -m ledger.check
#
# Deliberately UNPINNED, which is the one place in this estate that is right. quern here is the
# checker, not the content: it evaluates rules, it does not supply them. What decides a verdict
# is pinned by digest in quern.lock, and that is the file to read if a rule's meaning is ever in
# question. A rev here would be a second pin governing nothing, going stale in a comment nobody
# runs — and the failure mode of pinning the tool is a check that quietly stops matching the
# substrate it is meant to be checked against.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flight_recorder"]

# The sdist ships the Python distribution, not the repo. The other five runtimes (csharp, go,
# java, js, php) live in the tree beside this one, and their build outputs — 157 files, 2.6MB of
# compiled .NET under bin/ and obj/ — were being swept in by the default "everything tracked"
# rule. A PyPI version is write-once, so the scope is stated explicitly rather than inherited.
[tool.hatch.build.targets.sdist]
only-include = [
    "flight_recorder",
    "spec",
    "tests",
    "conftest.py",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CONTRIBUTING.md",
    "SECURITY.md",
]
exclude = ["**/__pycache__"]
